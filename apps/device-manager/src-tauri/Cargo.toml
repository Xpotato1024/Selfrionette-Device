[package]
name = "selfrionette-device-manager"
version = "0.2.0-preview.1"
edition = "2024"
[lib]
name = "device_manager"
crate-type = ["lib", "cdylib", "staticlib"]
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
selfrionette-core = { path = "../../../crates/selfrionette-core" }
selfrionette-serial = { path = "../../../crates/selfrionette-serial" }
sha2 = "=0.10.9"
serialport = { version = "=4.10.1", default-features = false }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }
[build-dependencies]
tauri-build = { version = "2", features = [] }
[workspace]
