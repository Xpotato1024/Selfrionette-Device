; Build the frozen archived source without editing it. No upload target is run.
[platformio]
src_dir = ../legacy/xpotato-sim/arduino/legacy_selfrionette/loadcell_7ch_legacy/src

[env:legacy_7ch]
platform = atmelavr@5.2.0
board = sparkfun_promicro16
framework = arduino
platform_packages =
  platformio/framework-arduino-avr@5.3.0
  platformio/toolchain-atmelavr@1.70300.191015
  platformio/tool-avrdude@1.60300.200527
  platformio/tool-scons@4.40801.0
monitor_speed = 115200
