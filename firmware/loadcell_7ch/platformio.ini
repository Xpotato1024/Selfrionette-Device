[platformio]
default_envs = pro_micro_7ch

[env]
platform = atmelavr@5.2.0
board = sparkfun_promicro16
framework = arduino
platform_packages =
  platformio/framework-arduino-avr@5.3.0
  platformio/toolchain-atmelavr@1.70300.191015
  platformio/tool-avrdude@1.60300.200527
  platformio/tool-scons@4.40801.0
monitor_speed = 115200
extra_scripts = pre:inject_source_sha.py

[env:pro_micro_7ch]
custom_quality_stream_rate_hz = 80

[env:pro_micro_7ch_40hz]
custom_quality_stream_rate_hz = 40

[env:pro_micro_7ch_20hz]
custom_quality_stream_rate_hz = 20
