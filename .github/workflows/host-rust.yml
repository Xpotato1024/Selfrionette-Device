name: Host Rust
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      core: ${{ steps.scope.outputs.core }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test tools/ci-scope.test.mjs
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'all' }}
        run: node tools/ci-scope.mjs "$BASE"
  test:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust core
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: device-${{ runner.os }}-core-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            device-${{ runner.os }}-core-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - name: Package portable field-test kit on Windows
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          cargo +stable build --locked -p selfrionettectl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/field-test/package-kit.ps1
      - name: Publish portable field-test kit for laptop
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: selfrionette-field-test-win-x64-${{ github.event.pull_request.head.sha }}
          path: target/field-test-kit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  frontend:
    name: Fast UI and tooling checks
    needs: scope
    if: needs.scope.outputs.frontend == 'true' || needs.scope.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/device-manager
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/device-manager/package-lock.json
      - run: npm ci
      - run: npm run check:fast
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: desktop-ui-qa-${{ github.run_id }}
          path: apps/device-manager/src-tauri/target/desktop-qa/
          retention-days: 14
  device-manager:
    name: Device Manager native boundary (Windows)
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust native
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/device-manager/src-tauri/target/debug
          key: device-${{ runner.os }}-native-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            device-${{ runner.os }}-native-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/device-manager/package-lock.json
      - run: npm ci
        working-directory: apps/device-manager
      - run: cargo +stable fmt --manifest-path apps/device-manager/src-tauri/Cargo.toml --check
      - run: cargo +stable clippy --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo +stable test --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --lib
      - name: Build native Debug (no installer)
        working-directory: apps/device-manager
        run: npm run build -- --debug
