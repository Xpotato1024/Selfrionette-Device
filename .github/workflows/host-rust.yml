name: Host Rust

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/device-manager/**"
      - "docs/contracts/host-device-core.md"
      - "docs/contracts/serial-transport.md"
      - "docs/contracts/sample-monitor.md"
      - "docs/decisions/0007-bounded-identity-checked-monitor.md"
      - "tests/fixtures/protocol-v2-monitor.txt"
      - "docs/decisions/0005-rust-host-core-cli.md"
      - "docs/decisions/0006-explicit-serial-transport.md"
      - ".github/workflows/host-rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/device-manager/**"
      - "docs/contracts/host-device-core.md"
      - "docs/contracts/serial-transport.md"
      - "docs/contracts/sample-monitor.md"
      - "docs/decisions/0007-bounded-identity-checked-monitor.md"
      - "tests/fixtures/protocol-v2-monitor.txt"
      - "docs/decisions/0005-rust-host-core-cli.md"
      - "docs/decisions/0006-explicit-serial-transport.md"
      - ".github/workflows/host-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo +stable fmt --check

      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +stable test --locked --workspace

  device-manager:
    name: Device Manager software tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Install locked frontend tooling
        working-directory: apps/device-manager
        run: npm ci

      - name: Frontend workflow tests
        working-directory: apps/device-manager
        run: npm test

      - name: Format application
        run: cargo +stable fmt --manifest-path apps/device-manager/src-tauri/Cargo.toml --check

      - name: Clippy application
        run: cargo +stable clippy --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Application workflow tests
        run: cargo +stable test --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --lib

      - name: Build Debug application (no bundle, no hardware)
        working-directory: apps/device-manager
        run: npm run build -- --debug
