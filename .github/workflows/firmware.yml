name: Firmware

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/device-identity.md"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/device-identity.md"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pro-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Build firmware
        working-directory: firmware/loadcell_7ch
        run: pio run -e pro_micro_7ch
