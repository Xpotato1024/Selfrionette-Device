name: Firmware

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/firmware-protocol-v3.md"
      - "docs/contracts/device-persistent-settings.md"
      - "docs/contracts/legacy-sim-serial-producer.md"
      - "docs/contracts/device-identity.md"
      - "docs/contracts/firmware-memory-budget.md"
      - "tools/check_firmware_size.py"
      - "tests/test_check_firmware_size.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/firmware-protocol-v3.md"
      - "docs/contracts/device-persistent-settings.md"
      - "docs/contracts/legacy-sim-serial-producer.md"
      - "docs/contracts/device-identity.md"
      - "docs/contracts/firmware-memory-budget.md"
      - "tools/check_firmware_size.py"
      - "tests/test_check_firmware_size.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pro-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test persistent-setting journal without hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/device_settings.cpp -o "$RUNNER_TEMP/device-settings-test"
          "$RUNNER_TEMP/device-settings-test"
          g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/firmware_protocol_v3.cpp -o "$RUNNER_TEMP/firmware-protocol-v3-test"
          "$RUNNER_TEMP/firmware-protocol-v3-test"

      - name: Test memory budget parser
        run: python -m unittest tests/test_check_firmware_size.py

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Build firmware and enforce memory budget
        env:
          SELFRIONETTE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/check_firmware_size.py
          --project-dir firmware/loadcell_7ch
          --environment pro_micro_7ch
          --max-static-ram 1024
          --max-flash 24576

      - name: Compile settings contract for ATmega32U4 without linking or uploading
        run: >-
          "$HOME/.platformio/packages/toolchain-atmelavr/bin/avr-g++"
          -std=gnu++11 -mmcu=atmega32u4 -Os -fno-exceptions -fno-rtti -Wall -Wextra -Werror
          -c firmware/tests/device_settings_avr.cpp -o "$RUNNER_TEMP/device-settings-avr.o"
      - name: Compile quality contract for ATmega32U4 without uploading
        run: >-
          "$HOME/.platformio/packages/toolchain-atmelavr/bin/avr-g++"
          -std=gnu++11 -mmcu=atmega32u4 -Os -fno-exceptions -fno-rtti -Wall -Wextra -Werror
          -c firmware/tests/firmware_protocol_v3_avr.cpp -o "$RUNNER_TEMP/firmware-protocol-v3-avr.o"

  build-legacy-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firmware/legacy/xpotato-sim/arduino/legacy_selfrionette/loadcell_7ch_pro_micro
            environment: pro_micro_7ch
          - project: firmware/legacy/xpotato-sim/arduino/legacy_selfrionette/loadcell_7ch_legacy
            environment: sparkfun_promicro16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"
      - name: Compile legacy reference and report Flash / SRAM
        run: pio run -d "${{ matrix.project }}" -e "${{ matrix.environment }}"
