name: Firmware

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/legacy-sim-serial-producer.md"
      - "docs/contracts/device-identity.md"
      - "docs/contracts/firmware-memory-budget.md"
      - "tools/check_firmware_size.py"
      - "tests/test_check_firmware_size.py"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "docs/contracts/firmware-protocol-v2.md"
      - "docs/contracts/legacy-sim-serial-producer.md"
      - "docs/contracts/device-identity.md"
      - "docs/contracts/firmware-memory-budget.md"
      - "tools/check_firmware_size.py"
      - "tests/test_check_firmware_size.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pro-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test memory budget parser
        run: python -m unittest tests/test_check_firmware_size.py

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Build firmware and enforce memory budget
        run: >-
          python tools/check_firmware_size.py
          --project-dir firmware/loadcell_7ch
          --environment pro_micro_7ch
          --max-static-ram 1024
          --max-flash 24576

  build-legacy-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firmware/legacy/xpotato-sim/arduino/legacy_selfrionette/loadcell_7ch_pro_micro
            environment: pro_micro_7ch
          - project: firmware/legacy/xpotato-sim/arduino/legacy_selfrionette/loadcell_7ch_legacy
            environment: sparkfun_promicro16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"
      - name: Compile legacy reference and report Flash / SRAM
        run: pio run -d "${{ matrix.project }}" -e "${{ matrix.environment }}"
