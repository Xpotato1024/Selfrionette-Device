name: Device Manager Windows distribution

on:
  pull_request:
    paths:
      - 'apps/device-manager/src-tauri/src/**'
      - 'apps/device-manager/src-tauri/windows/**'
      - 'apps/device-manager/src-tauri/tauri*.json'
      - 'apps/device-manager/src-tauri/Cargo.*'
      - 'apps/device-manager/package*.json'
      - 'apps/device-manager/frontend/**'
      - 'apps/device-manager/tools/package-windows.mjs'
      - 'apps/device-manager/tools/distribution-lib.mjs'
      - 'apps/device-manager/tools/artifact-inputs.mjs'
      - 'apps/device-manager/tools/platformio-requirements.txt'
      - 'apps/device-manager/tools/stage-release.mjs'
      - 'apps/device-manager/tools/verify-release-assets.mjs'
      - 'apps/device-manager/tools/**'
      - 'apps/device-manager/licenses/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'THIRD_PARTY_NOTICES.md'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'crates/**'
      - 'firmware/loadcell_7ch/**'
      - 'firmware/shared/**'
      - 'firmware/editions.json'
      - 'firmware/legacy/**'
      - 'firmware/legacy_7ch_package/**'
      - 'firmware/compatible_7ch_package/**'
      - 'tools/check_firmware_size.py'
      - 'docs/contracts/firmware-protocol-v3.md'
      - 'docs/contracts/firmware-update.md'
      - 'docs/contracts/firmware-memory-budget.md'
      - 'docs/releases/**'
      - 'docs/operations/device-manager-distribution.md'
      - '.github/workflows/device-manager-distribution.yml'
  push:
    tags: ['device-manager-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Tag and PR source contracts (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Isolate contract test outputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/codex/device-manager/$GITHUB_RUN_ID/contracts"
          test ! -e "$root"
          mkdir -p "$root"
          printf 'SELFRIONETTE_TASK_TEMP_ROOT=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s\nPYTHONPYCACHEPREFIX=%s\n' "$root" "$root" "$root/cargo" "$root/python-cache" >> "$GITHUB_ENV"
      - name: Install Rust verification components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Verify shared host contracts
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --workspace --all-targets -- -D warnings
          cargo +stable test --locked --workspace
      - name: Verify firmware journal, acquisition and parser contracts
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/device_settings.cpp -o "$SELFRIONETTE_TASK_TEMP_ROOT/settings-test"
          "$SELFRIONETTE_TASK_TEMP_ROOT/settings-test"
          g++ -std=c++11 -Wall -Wextra -Werror firmware/tests/firmware_protocol_v3.cpp -o "$SELFRIONETTE_TASK_TEMP_ROOT/protocol-test"
          "$SELFRIONETTE_TASK_TEMP_ROOT/protocol-test"
          python -m unittest tests/test_check_firmware_size.py
      - name: Remove contract test temporary root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/codex/device-manager/$GITHUB_RUN_ID/contracts"
          test "$SELFRIONETTE_TASK_TEMP_ROOT" = "$expected"
          test "${expected#/}" != "$expected"
          rm -rf -- "$expected"
  build:
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create the build task temporary root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = Join-Path $env:RUNNER_TEMP "codex/device-manager/$env:GITHUB_RUN_ID/build"
          if (Test-Path -LiteralPath $taskRoot) { throw 'Task temporary root already exists' }
          New-Item -ItemType Directory -Path $taskRoot | Out-Null
          @(
            "SELFRIONETTE_TASK_TEMP_ROOT=$taskRoot"
            "CARGO_TARGET_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'apps/device-manager/src-tauri/target')"
            "TEMP=$taskRoot"
            "TMP=$taskRoot"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/device-manager/package-lock.json
      - name: Install Rust toolchain
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust release
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/device-manager/src-tauri/target/release
          key: device-${{ runner.os }}-release-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            device-${{ runner.os }}-release-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}-
      - name: Install locked build dependencies
        working-directory: apps/device-manager
        run: npm ci
      - name: Test frontend and distribution invariants
        working-directory: apps/device-manager
        run: |
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:package
          exit $LASTEXITCODE
      - name: Verify Windows shared and native boundaries before packaging
        shell: pwsh
        run: |
          cargo +stable fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable fmt --manifest-path apps/device-manager/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable clippy --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable test --locked --manifest-path apps/device-manager/src-tauri/Cargo.toml --lib
          exit $LASTEXITCODE
      - name: Build release EXE, offline installer and ZIP
        working-directory: apps/device-manager
        run: npm run package:windows
      - name: Test NSIS path resolution with isolated registry fixtures
        working-directory: apps/device-manager
        run: node tools/test-installer-state.mjs
      - name: Store immutable build for independent verification
        uses: actions/upload-artifact@v7.0.2
        with:
          name: device-manager-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.exe
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.zip
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.json
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.md
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove build task temporary root
        if: always()
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "codex/device-manager/$env:GITHUB_RUN_ID/build"
          $actual = [IO.Path]::GetFullPath($env:SELFRIONETTE_TASK_TEMP_ROOT)
          if ($actual -ne [IO.Path]::GetFullPath($expected)) { throw 'Refusing to remove an unexpected temporary path' }
          if (Test-Path -LiteralPath $actual) { Remove-Item -LiteralPath $actual -Recurse -Force }
  verify:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Create the verification task temporary root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = Join-Path $env:RUNNER_TEMP "codex/device-manager/$env:GITHUB_RUN_ID/verify"
          if (Test-Path -LiteralPath $taskRoot) { throw 'Task temporary root already exists' }
          New-Item -ItemType Directory -Path $taskRoot | Out-Null
          @(
            "SELFRIONETTE_TASK_TEMP_ROOT=$taskRoot"
            "TEMP=$taskRoot"
            "TMP=$taskRoot"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/device-manager/package-lock.json
      - run: npm ci
        working-directory: apps/device-manager
      - uses: actions/download-artifact@v5
        with:
          name: device-manager-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/device-manager/dist
      - name: Verify product fingerprint and rebind build paths (no rebuild)
        working-directory: apps/device-manager
        run: node tools/prepare-artifact.mjs dist
      - name: Install the packaged application on the ephemeral runner
        shell: pwsh
        working-directory: apps/device-manager
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content dist/latest-distribution.json -Raw | ConvertFrom-Json
          $setup = @(Get-ChildItem $build.directory -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected one installer' }
          $target = Join-Path $env:SELFRIONETTE_TASK_TEMP_ROOT 'install-test'
          if (Test-Path $target) { throw 'Installation target must be new' }
          $keys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*', 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*')
          Write-Output 'WebView2 before installation:'
          Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object name -Match 'WebView' | Select-Object name,pv
          $process = Start-Process $setup[0].FullName -ArgumentList @('/S', "/D=$target") -PassThru
          if (-not $process.WaitForExit(300000)) { throw 'Installer did not finish within five minutes' }
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $target 'selfrionette-device-manager.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable is missing' }
          "SELFRIONETTE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          $buildInfo = Get-Content (Join-Path $build.directory 'BUILD-INFO.json') -Raw | ConvertFrom-Json
          $cli = Join-Path $target 'distribution/selfrionettectl.exe'
          if (-not (Test-Path $cli)) { throw 'Installed CLI executable is missing' }
          if ((Get-FileHash $cli).Hash -ne $buildInfo.cli.executable_sha256) { throw 'Installed CLI differs from the verified package' }
          "SELFRIONETTE_INSTALLED_CLI=$cli" >> $env:GITHUB_ENV
          $actual = (Get-FileHash $exe).Hash
          $expected = (Get-FileHash $build.executable).Hash
          Write-Output "Installed SHA-256: $actual"
          Write-Output "Packaged SHA-256: $expected"
          if ($actual -ne $expected) { throw 'Installed executable differs from packaged executable' }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Selfrionette Device Manager'
          if ($entry.Publisher -ne 'Xpotato.net') { throw 'Installed publisher metadata is incorrect' }
          Write-Output "Installed publisher: $($entry.Publisher)"
          Write-Output 'WebView2 after installation:'
          Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object name -Match 'WebView' | Select-Object name,pv
      - name: Test extracted release without developer PATH
        env:
          SELFRIONETTE_CI_WEBVIEW_POLICY: '1'
        working-directory: apps/device-manager
        run: npm run test:distribution
      - name: Verify packaged app through native IPC and shared service workflows
        shell: pwsh
        working-directory: apps/device-manager
        env:
          SELFRIONETTE_CI_WEBVIEW_POLICY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content dist/latest-distribution.json -Raw | ConvertFrom-Json
          $env:SELFRIONETTE_GUI_EXE = $build.executable
          node tools/live-native-qa.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test upgrade, cancellation and same-version repair
        shell: pwsh
        run: ./apps/device-manager/tools/test-installer-upgrade.ps1
      - name: Uninstall only the test application
        if: always() && env.SELFRIONETTE_INSTALLED_EXE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($sub in @('AdditionalBrowserArguments','UserDataFolder')) {
            $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\' + $sub
            if (Test-Path $key) { Remove-ItemProperty $key -Name 'selfrionette-device-manager.exe' -ErrorAction SilentlyContinue }
          }
          $folder = Split-Path $env:SELFRIONETTE_INSTALLED_EXE
          $uninstall = Join-Path $folder 'uninstall.exe'
          if (-not (Test-Path $uninstall)) { throw 'Test uninstaller is missing' }
          $process = Start-Process $uninstall -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Uninstaller timeout' }
          for ($i=0; $i -lt 30 -and (Test-Path $env:SELFRIONETTE_INSTALLED_EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:SELFRIONETTE_INSTALLED_EXE) { throw 'Test application was not removed' }
      - name: Upload binary distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: device-manager-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.exe
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.zip
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.json
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.md
            apps/device-manager/dist/Selfrionette-Device-Manager*/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Keep scoped validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: distribution-qa-${{ github.run_id }}
          path: |
            apps/device-manager/src-tauri/target/distribution-qa/run-*/report.json
            apps/device-manager/src-tauri/target/native-qa/run-*/report.json
            apps/device-manager/src-tauri/target/native-qa/run-*/*.png
            apps/device-manager/src-tauri/target/native-qa/live/**/*.png
            apps/device-manager/src-tauri/target/native-qa/live/**/REPORT.json
            ${{ runner.temp }}/codex/device-manager/${{ github.run_id }}/verify/upgrade-qa/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove verification task temporary root
        if: always()
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "codex/device-manager/$env:GITHUB_RUN_ID/verify"
          $actual = [IO.Path]::GetFullPath($env:SELFRIONETTE_TASK_TEMP_ROOT)
          if ($actual -ne [IO.Path]::GetFullPath($expected)) { throw 'Refusing to remove an unexpected temporary path' }
          if (Test-Path -LiteralPath $actual) { Remove-Item -LiteralPath $actual -Recurse -Force }

  publish:
    name: Publish verified GitHub release
    if: startsWith(github.ref, 'refs/tags/device-manager-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to point to committed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: device-manager-windows-x64-${{ github.sha }}
          path: dist/release-assets
      - uses: actions/download-artifact@v5
        with:
          name: distribution-qa-${{ github.run_id }}
          path: dist/release-qa
      - name: Verify checksums, source, version, licenses and release notes
        run: node apps/device-manager/tools/stage-release.mjs
      - name: Upload only verified assets into a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prerelease=false
          [[ "${tag#device-manager-v}" == *-* ]] && prerelease=true
          flags=("--prerelease=$prerelease")
          mapfile -d '' assets < <(find dist/release-upload -maxdepth 1 -type f -print0 | sort -z)
          test "${#assets[@]}" -eq 9
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true"
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file dist/release-notes.md --title "Selfrionette Device Manager ${tag#device-manager-v}" "${flags[@]}"
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --draft "${flags[@]}" \
              --title "Selfrionette Device Manager ${tag#device-manager-v}" \
              --notes-file dist/release-notes.md
          fi
          # Draft releases are not resolved by the public tag endpoint.
          release_id="$(gh release view "$tag" --json databaseId --jq '.databaseId')"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > dist/release-response.json
          node apps/device-manager/tools/verify-release-assets.mjs
          gh release edit "$tag" --draft=false "${flags[@]}"
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = "$prerelease"
          echo "Release published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
